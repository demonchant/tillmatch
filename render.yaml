services:
  - type: web
    name: tillmatch
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm migrate:production && NITRO_PRESET=render_com corepack pnpm build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /dashboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_URL
        fromDatabase:
          name: tillmatch-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_ENVIRONMENT
        value: test

databases:
  - name: tillmatch-postgres
    databaseName: tillmatch
    user: tillmatch
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
